[project]
name = "pet-pricing-skill-eval"
version = "0.1.0"
description = "Eval of whether a feature-importance skill improves LLM pet insurance price estimates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "inspect-ai>=0.3.282",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
